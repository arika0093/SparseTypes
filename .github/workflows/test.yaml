name: Strict tests

on:
  workflow_call:
    inputs:
      full-matrix:
        description: Run unit, fragments, and NativeAOT checks on the full multi-OS matrix (release gate). Direct pushes and PRs run ubuntu-only.
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    # Version-bump pushes are validated by release.yaml, which invokes this
    # reusable workflow as its strict-test gate.
    paths-ignore:
      - version.json
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full-matrix:
        description: Run unit, fragments, and NativeAOT checks on the full multi-OS matrix.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Cancel superseded PR runs so rapid pushes do not pile up redundant matrices.
# Main and release validation are never cancelled.
concurrency:
  group: strict-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Run direct and called workflows, skipping Dependabot PRs already checked by
# their caller.

jobs:
  # Check shippable C# sources on every run, including the source-only Shared
  # package, which project-level formatter targets do not compile.
  format:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier check src/

  # Build portable managed tests once, then execute the same bytes on each OS.
  unit-build:
    if: >-
      github.workflow != 'Strict tests' ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore unit test dependencies
        run: dotnet restore tests/SparseTypes.Tests/SparseTypes.Tests.csproj

      - name: Build unit tests
        run: dotnet build tests/SparseTypes.Tests/SparseTypes.Tests.csproj --no-restore --configuration Release

      - name: Archive portable unit tests
        run: |
          mkdir -p TestResults
          tar -czf TestResults/unit-tests.tar.gz -C tests/SparseTypes.Tests/bin/Release/net10.0 .

      - name: Upload portable unit tests
        uses: actions/upload-artifact@v7
        with:
          name: strict-unit-tests
          path: TestResults/unit-tests.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  # Runtime and generator probes still execute natively on every selected OS.
  unit:
    needs: unit-build
    if: >-
      github.workflow != 'Strict tests' ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Slim by default (ubuntu-only). The release gate re-runs this matrix in full via full-matrix: true.
        os: ${{ inputs.full-matrix && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download portable unit tests
        uses: actions/download-artifact@v8
        with:
          name: strict-unit-tests
          path: TestResults

      - name: Extract portable unit tests
        shell: bash
        run: |
          mkdir -p TestResults/unit-binaries
          tar -xzf TestResults/unit-tests.tar.gz -C TestResults/unit-binaries

      - name: Run unit tests
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: >
          dotnet TestResults/unit-binaries/SparseTypes.Tests.dll
          --results-directory "$GITHUB_WORKSPACE/TestResults"
          --timeout 20m --report-trx

      - name: Run unit tests with coverage
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: >
          dotnet TestResults/unit-binaries/SparseTypes.Tests.dll
          --results-directory "$GITHUB_WORKSPACE/TestResults/coverage"
          --timeout 20m --report-trx --coverage
          --coverage-settings "$GITHUB_WORKSPACE/tests/coverage.config"
          --coverage-output coverage.cobertura.xml --coverage-output-format cobertura

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: TestResults/coverage/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failure test artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: strict-unit-results-${{ matrix.os }}
          path: |
            TestResults/**/*.trx
            TestResults/**/*.xml
            tests/**/TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  # Fragments tests build independently of the full runtime and Playground.
  fragments:
    if: >-
      github.workflow != 'Strict tests' ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Slim by default (ubuntu-only). The release gate re-runs this matrix in full via full-matrix: true.
        os: ${{ inputs.full-matrix && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Fragments tests
        run: dotnet restore tests/SparseTypes.Fragments.Tests/SparseTypes.Fragments.Tests.csproj

      - name: Build Fragments tests
        run: dotnet build tests/SparseTypes.Fragments.Tests/SparseTypes.Fragments.Tests.csproj --no-restore --configuration Release

      - name: Run Fragments tests
        run: >
          dotnet test tests/SparseTypes.Fragments.Tests/SparseTypes.Fragments.Tests.csproj
          --no-build --no-restore --configuration Release --framework net10.0
          --results-directory TestResults/fragments --no-progress
          -- --timeout 20m --report-trx

      - name: Upload failure Fragments artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: strict-fragments-results-${{ matrix.os }}
          path: |
            TestResults/fragments/**/*.trx
            TestResults/fragments/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  # Public API surface gate.
  public-api:
    if: >-
      github.workflow != 'Strict tests' ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore PublicApi test dependencies
        run: dotnet restore tests/SparseTypes.Tests.PublicApi/SparseTypes.Tests.PublicApi.csproj

      - name: Build PublicApi tests
        run: dotnet build tests/SparseTypes.Tests.PublicApi/SparseTypes.Tests.PublicApi.csproj --no-restore --configuration Release

      - name: Run PublicApi tests
        run: >
          dotnet test tests/SparseTypes.Tests.PublicApi/SparseTypes.Tests.PublicApi.csproj
          --no-build --no-restore --configuration Release
          --results-directory TestResults/public-api --no-progress
          -- --timeout 20m --report-trx

      - name: Upload failure PublicApi artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: strict-public-api-results
          path: |
            TestResults/public-api/**/*.trx
            TestResults/public-api/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  # Pack once, verify integrity, then test consumers, README, and docs against
  # those same package bytes. One OS is sufficient for packaging.
  packages:
    if: >-
      github.workflow != 'Strict tests' ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Pack NuGet packages
        # Let pack restore and build; this job has not restored the projects.
        # Pack every runtime package and the source-only Shared package once.
        run: >
          dotnet pack src/SparseTypes.Core/SparseTypes.Core.csproj
          --configuration Release --output artifacts &&
          dotnet pack src/SparseTypes.Fragments/SparseTypes.Fragments.csproj
          --configuration Release --output artifacts &&
          dotnet pack src/SparseTypes/SparseTypes.csproj
          --configuration Release --output artifacts &&
          dotnet pack src/SparseTypes.Blazor/SparseTypes.Blazor.csproj
          --configuration Release --output artifacts &&
          dotnet pack src/SparseTypes.EntityFrameworkCore/SparseTypes.EntityFrameworkCore.csproj
          --configuration Release --output artifacts &&
          dotnet pack src/SparseTypes.OpenApi.AspNetCore/SparseTypes.OpenApi.AspNetCore.csproj
          --configuration Release --output artifacts &&
          dotnet pack src/SparseTypes.OpenApi.Swashbuckle/SparseTypes.OpenApi.Swashbuckle.csproj
          --configuration Release --output artifacts &&
          dotnet pack src/SparseTypes.Generator.Shared/SparseTypes.Generator.Shared.csproj
          --configuration Release --output artifacts

      - name: Verify packed target assets
        run: bash ./.github/workflows/scripts/verify-packages.sh artifacts

      - name: Upload packages for consumer checks
        uses: actions/upload-artifact@v7
        with:
          name: strict-test-packages
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 1

  package-consumers:
    needs: packages
    uses: ./.github/workflows/package-consumer-checks.yaml
    with:
      package-artifact: strict-test-packages
      # Everyday CI covers oldest+newest TFMs; the release gate runs the full list.
      slim-frameworks: ${{ !inputs.full-matrix }}

  javascript-codegen:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            src/SparseTypes.JS.CodeGen/package-lock.json
            samples/EfCoreSample/EfCoreSample.WebClient/package-lock.json

      - name: Install codegen dependencies
        run: npm ci --prefix src/SparseTypes.JS.CodeGen

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Test and type-check codegen
        run: |
          npm test --prefix src/SparseTypes.JS.CodeGen
          npm run typecheck --prefix src/SparseTypes.JS.CodeGen
          npm run format:check --prefix src/SparseTypes.JS.CodeGen

      - name: Check package contents
        working-directory: src/SparseTypes.JS.CodeGen
        run: npm run pack:versioned -- --dry-run

      - name: Install sample web dependencies
        run: npm ci --prefix samples/EfCoreSample/EfCoreSample.WebClient

      - name: Generate the sample client from OpenAPI
        run: dotnet build samples/EfCoreSample/EfCoreSample.Server/EfCoreSample.Server.csproj --configuration Release

      - name: Build sample web client
        run: |
          npm run build --prefix samples/EfCoreSample/EfCoreSample.WebClient
          npm run format:check --prefix samples/EfCoreSample/EfCoreSample.WebClient

      - name: Pack codegen npm package
        id: npm-package
        working-directory: src/SparseTypes.JS.CodeGen
        run: |
          npm run pack:versioned -- --pack-destination "$RUNNER_TEMP"
          version="$(dotnet nbgv get-version --variable NpmPackageVersion)"
          echo "path=$RUNNER_TEMP/sparsetypes-codegen-$version.tgz" >> "$GITHUB_OUTPUT"

      - name: Verify packed package in an isolated consumer
        run: |
          mkdir -p "$RUNNER_TEMP/codegen-consumer"
          npm install --prefix "$RUNNER_TEMP/codegen-consumer" --ignore-scripts --no-audit --no-fund "${{ steps.npm-package.outputs.path }}"
          node "$RUNNER_TEMP/codegen-consumer/node_modules/@sparsetypes/codegen/dist/src/cli.js" \
            samples/EfCoreSample/EfCoreSample.Server/obj/openapi/order-api.json \
            --output "$RUNNER_TEMP/codegen-output"
          test -s "$RUNNER_TEMP/codegen-output/changes.js"
          test -s "$RUNNER_TEMP/codegen-output/client.d.ts"
          test -s "$RUNNER_TEMP/codegen-output/index.js"
          test -s "$RUNNER_TEMP/codegen-output/models.js"

  docs-enforcement:
    if: >-
      github.workflow != 'Strict tests' ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify docs enforcement probes
        run: bash ./.github/workflows/scripts/test-check-docs-samples.sh

  # .NET Framework 4.8 compatibility gate for the packed core package. The net48
  # consumer runs on Windows; Blazor and net10 TUnit tests are excluded.
  netframework-consumer:
    if: >-
      github.workflow != 'Strict tests' ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Pack core NuGet package
        run: >
          dotnet pack src/SparseTypes.Core/SparseTypes.Core.csproj
          --configuration Release --output artifacts &&
          dotnet pack src/SparseTypes/SparseTypes.csproj
          --configuration Release --output artifacts

      - name: Verify net48 packed package consumer
        run: bash ./.github/workflows/scripts/verify-package-netfx-consumer.sh artifacts

      - name: Verify C# 9.0 language-version consumer
        run: bash ./.github/workflows/scripts/verify-package-langversion-consumer.sh artifacts

  # Publish and run the NativeAOT test binary independently of managed tests.
  # PRs use Linux; main and release run every supported OS before publishing.
  nativeaot:
    if: >-
      github.workflow != 'Strict tests' ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Slim by default (ubuntu-only). The release gate re-runs this matrix in full via full-matrix: true.
        os: ${{ inputs.full-matrix && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install NativeAOT prerequisites (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish NativeAOT tests
        shell: bash
        run: |
          mkdir -p TestResults
          dotnet publish tests/SparseTypes.Tests.NativeAot/SparseTypes.Tests.NativeAot.csproj \
            --configuration Release --framework net10.0 --use-current-runtime \
            --output TestResults/nativeaot-smoke --verbosity normal 2>&1 \
            | tee TestResults/nativeaot-publish.log

      - name: Assert NativeAOT diagnostics are clean
        shell: bash
        run: bash ./.github/workflows/scripts/assert-sparse-aot-diagnostics.sh TestResults/nativeaot-publish.log

      - name: Run NativeAOT tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./TestResults/nativeaot-smoke/SparseTypes.Tests.NativeAot.exe --report-trx --results-directory TestResults/nativeaot-results
          else
            ./TestResults/nativeaot-smoke/SparseTypes.Tests.NativeAot --report-trx --results-directory TestResults/nativeaot-results
          fi

      - name: Upload failure NativeAOT artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: strict-nativeaot-results-${{ matrix.os }}
          path: |
            TestResults/nativeaot-publish.log
            TestResults/nativeaot-smoke/**
            TestResults/nativeaot-results/**
          if-no-files-found: ignore
          retention-days: 7
